name: Upgrade hero sprite to native 128px detail

on:
  push:
    paths:
      - 'scripts/upgrade-hero-128.mjs'
      - '.github/workflows/upgrade-hero.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rewrite hero sprite
        run: node scripts/upgrade-hero-128.mjs
      - name: Commit upgraded sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade protagonist to detailed native 128px sprite"
          git push
# one-shot trigger
