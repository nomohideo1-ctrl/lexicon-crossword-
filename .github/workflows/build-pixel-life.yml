name: Build PIXEL LIFE game bundle

on:
  push:
    paths:
      - '.github/workflows/build-pixel-life.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Concatenate game source
        run: cat tmp/pixel-life/game.part1.txt tmp/pixel-life/game.part2.txt tmp/pixel-life/game.part3.txt tmp/pixel-life/game.part4.txt tmp/pixel-life/game.part5.txt > game.js
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit game bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git diff --cached --quiet && exit 0
          git commit -m "Build PIXEL LIFE idle world"
          git push
