<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1118" />
  <title>PIXEL LIFE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">A TINY WORLD THAT LIVES WITHOUT YOU</div>
        <h1>PIXEL <span>LIFE</span></h1>
      </div>
      <button id="observeBtn" class="icon-btn" type="button" aria-label="観察モード">◉</button>
    </header>

    <section class="world-card">
      <canvas id="world" width="384" height="640" aria-label="時間とともに生活するドット絵の世界"></canvas>
      <div class="world-hud top-left">
        <span>XP</span><strong id="xpValue">0</strong>
        <small id="xpRate">+0.0 / sec</small>
      </div>
      <div class="world-hud top-right">
        <span id="clockLabel">--:--</span>
        <strong id="weatherLabel">CLEAR</strong>
      </div>
      <div class="activity-strip">
        <span class="pulse-dot"></span>
        <strong id="activityLabel">小屋で目を覚ました</strong>
      </div>
    </section>

    <section id="controls" class="controls">
      <div class="stat-row">
        <article><span>総獲得XP</span><strong id="totalXp">0</strong></article>
        <article><span>世界レベル</span><strong id="worldLevel">1</strong></article>
        <article><span>発見</span><strong id="discoveries">0</strong></article>
      </div>

      <nav class="tabs" aria-label="メニュー">
        <button class="tab active" data-tab="growth" type="button">成長</button>
        <button class="tab" data-tab="journal" type="button">日誌</button>
      </nav>

      <section id="growthPanel" class="tab-panel active">
        <div class="section-copy">
          <div><span class="eyebrow">UNLOCK THE WORLD</span><h2>XPで暮らしを増やす</h2></div>
          <p>能力を買うほど、主人公が勝手にすることと風景が増える。</p>
        </div>
        <div id="upgradeGrid" class="upgrade-grid"></div>
      </section>

      <section id="journalPanel" class="tab-panel">
        <div class="section-copy">
          <div><span class="eyebrow">LIFE LOG</span><h2>今日の出来事</h2></div>
          <button id="clearLogBtn" class="text-btn" type="button">ログ消去</button>
        </div>
        <ol id="eventLog" class="event-log"></ol>
      </section>
    </section>

    <div id="offlineModal" class="modal" hidden>
      <div class="modal-card">
        <div class="eyebrow">WELCOME BACK</div>
        <h2>留守のあいだも生きてた</h2>
        <p id="offlineText"></p>
        <button id="offlineOk" class="primary-btn" type="button">世界を見る</button>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
